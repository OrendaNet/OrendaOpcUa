name: Release OPC UA Integrator
on:
  workflow_dispatch:
    inputs:
      qualified_commit:
        description: Full candidate commit qualified on both QEMU targets
        type: string
        required: true
      qualified_digest:
        description: Immutable ARM64 image digest qualified on both targets
        type: string
        required: true
permissions:
  contents: write
  packages: write
  id-token: write
concurrency: opcua-release
jobs:
  release:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reserve a new version
        run: |
          version="$(cat VERSION)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test -z "$(git ls-remote --tags origin refs/tags/$version)"
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: Verify the qualified candidate and the release sources
        env:
          CANDIDATE: ${{ inputs.qualified_commit }}
          DIGEST: ${{ inputs.qualified_digest }}
        run: |
          [[ "$GITHUB_REF" == refs/heads/main ]]
          [[ "$CANDIDATE" =~ ^[a-f0-9]{40}$ && "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          git diff --exit-code "$CANDIDATE" HEAD -- Dockerfile .dockerignore package.json package-lock.json server.js lib native public orenda-app.json
          image="ghcr.io/orendanet/orenda-opcua"
          docker pull --platform linux/arm64 "$image:candidate-$CANDIDATE"
          test "$(docker inspect --format '{{index .RepoDigests 0}}' "$image:candidate-$CANDIDATE")" = "$image@$DIGEST"
          sh tools/qualify-image.sh "$image@$DIGEST"
          echo "IMAGE_DIGEST=$DIGEST" >> "$GITHUB_ENV"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push the tested image
        run: |
          target="ghcr.io/orendanet/orenda-opcua:$VERSION"
          docker tag "ghcr.io/orendanet/orenda-opcua@$IMAGE_DIGEST" "$target"
          docker push "$target"
          ref="$(docker inspect "$target" --format '{{index .RepoDigests 0}}')"
          test "${ref##*@}" = "$IMAGE_DIGEST"
      - uses: sigstore/cosign-installer@v3
      - name: Sign digest
        run: cosign sign --yes "ghcr.io/orendanet/orenda-opcua@$IMAGE_DIGEST"
      - name: Generate and validate the market manifest
        run: |
          node tools/release-manifest.js
          git clone --quiet https://github.com/OrendaNet/OrendaBoxSDK.git "$RUNNER_TEMP/box-sdk"
          git -C "$RUNNER_TEMP/box-sdk" fetch --quiet origin 0c80af8a5e7ef4f26d4d40e9c0cb7cf4b0b3b8c8
          git -C "$RUNNER_TEMP/box-sdk" checkout --quiet FETCH_HEAD
          node "$RUNNER_TEMP/box-sdk/bin/orenda-box-sdk.js" validate dist/orenda-app.json --release
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$VERSION" dist/orenda-app.json --target "$GITHUB_SHA" --title "OPC UA Integrator $VERSION" --notes-file docs/release.md
