name: Native ARM64 qualification
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t opcua-integrator:check .
      - run: docker run --rm -v "$PWD/tests:/app/tests:ro" opcua-integrator:check python -m unittest discover -t . -s tests
