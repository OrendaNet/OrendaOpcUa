name: Publish to Orenda App Market
on: workflow_dispatch
permissions:
  contents: read
concurrency: opcua-market
jobs:
  publish:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Download release manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release download "$(cat VERSION)" --pattern orenda-app.json --dir dist
      - name: Verify anonymous ARM64 image pull
        run: |
          image="$(jq -r '.versions[0].image' dist/orenda-app.json)"
          docker --config "$(mktemp -d)" pull --platform linux/arm64 "$image"
          test "$(docker inspect --format '{{.Architecture}}' "$image")" = arm64
      - uses: sigstore/cosign-installer@v3
      - name: Verify signed release identity
        run: cosign verify --certificate-identity "https://github.com/OrendaNet/OrendaOpcUa/.github/workflows/release.yml@refs/heads/main" --certificate-oidc-issuer "https://token.actions.githubusercontent.com" "$(jq -r '.versions[0].image' dist/orenda-app.json)"
      - name: Activate this app and verify storefront
        env:
          ORENDA_REPO_ADMIN_USERNAME: ${{ secrets.ORENDA_REPO_ADMIN_USERNAME }}
          ORENDA_REPO_ADMIN_PASSWORD: ${{ secrets.ORENDA_REPO_ADMIN_PASSWORD }}
        run: python tools/publish_market.py dist/orenda-app.json
