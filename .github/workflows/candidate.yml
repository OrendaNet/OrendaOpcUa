name: ARM64 emulator candidate
on:
  push:
    branches: [managed-box-export]
    paths:
      - Dockerfile
      - .dockerignore
      - package*.json
      - server.js
      - lib/**
      - native/**
      - public/**
      - tests/**
      - tools/qualify-image.sh
      - .github/workflows/candidate.yml
permissions:
  contents: read
  packages: write
jobs:
  image:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          image="ghcr.io/orendanet/orenda-opcua:candidate-$GITHUB_SHA"
          docker build -t "$image" .
          sh tools/qualify-image.sh "$image"
          docker push "$image"
