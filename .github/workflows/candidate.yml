name: ARM64 emulator candidate
on:
  push:
    branches: [managed-box-export]
permissions:
  contents: read
  packages: write
jobs:
  image:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          image="ghcr.io/orendanet/orenda-opcua:candidate-$GITHUB_SHA"
          docker build -t "$image" .
          docker run --rm -v "$PWD/tests:/app/tests:ro" "$image" python -m unittest discover -t . -s tests
          docker push "$image"
